<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripWise — Discover Earth</title>
<style>
/* === RESET === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#090807}
body *{cursor:none!important}
:root{--accent:#F97316;--bg:#090807}

/* === EXPERIENCE === */
.experience{position:relative;width:100%;height:100vh;min-height:540px;overflow:hidden;background:#0a0908;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;color:#fff}

/* === BACKGROUNDS === */
.backgrounds{position:absolute;inset:0}
.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}

/* === SHADE === */
.shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,transparent 50%,rgba(0,0,0,.9) 100%)}

/* === CHROME === */
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}
.is-transitioning .header,.is-transitioning .dest-list{opacity:1;filter:none;pointer-events:auto}

/* === HEADER === */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:flex-end;align-items:center;gap:12px}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;font-size:14px;line-height:1}
.nav a.active{background:#fff;color:#000}
.nav a:hover:not(.active){background:rgba(255,255,255,.15)}
.cta-btn{height:42px;padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:none!important}
.cta-btn:hover{background:#ea6c10}

/* === SIDEBAR === */
.dest-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px;color:rgba(255,255,255,.7)}
.dest-item{display:flex;align-items:center;min-height:20px}
.dest-item.is-active{font-size:18px;font-weight:700;color:#fff;gap:8px}
.dest-item.is-active::before{content:'';width:16px;height:16px;border-radius:50%;background:#fff;flex-shrink:0}

/* === PORTAL WRAP === */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%)}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0;color:rgba(255,255,255,.9)}
.portal-heading strong{font-size:18px;margin-left:6px;color:#fff}

/* === PORTAL BUTTON === */
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;border-radius:90px;background:transparent;cursor:none!important}
.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}

/* === CANVASES === */
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
#scene-canvas{position:fixed;inset:0;z-index:2;display:none;width:100%;height:100%;pointer-events:none}

/* === CITY CONTENT === */
.city-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.city-content h1{font-family:'Arial Narrow',Arial,sans-serif;font-size:clamp(128px,21.8vw,314px);font-weight:400;line-height:.72;letter-spacing:0;text-transform:uppercase;transform:translateX(-32px);opacity:0}
.city-content dl{width:min(447px,34vw);font-size:16px}
.city-fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.city-fact:last-child{border-bottom:0}
.city-fact dt{font-weight:700}
.city-fact dd{margin:0}

/* === LOADING === */
.loading-hint{position:absolute;z-index:12;left:50%;bottom:28px;transform:translateX(-50%);opacity:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.is-loading .loading-hint{opacity:.7}

/* === PRELOADER === */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
#preloader-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:pl-zoom 4s cubic-bezier(.2,0,.4,1) both}
@keyframes pl-zoom{from{transform:scale(1.4)}to{transform:scale(1)}}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-bg{z-index:0}
.preloader.is-bg .preloader-shade{opacity:0}

/* === FLOATING LOGO === */
.floating-logo{position:fixed;z-index:22;display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;left:50%;top:50%;transform:translate(-50%,-50%);will-change:left,top,transform;transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo .li{width:52px;height:52px;transition:width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1);flex-shrink:0}
.floating-logo .lt{font-size:22px;font-weight:700;letter-spacing:-.01em;transition:font-size 2s cubic-bezier(.16,1,.3,1)}
.floating-logo em{color:var(--accent);font-style:normal}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);transform:none}
.floating-logo.is-docked .li{width:32px;height:32px}
.floating-logo.is-docked .lt{font-size:18px}
.floating-logo.is-settled{z-index:5}

/* === COUNT === */
.count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);transform:translateX(-50%);display:flex;align-items:flex-end;gap:4px;line-height:1}
.count .cv{font-size:64px;font-weight:100}
.count .pct{font-size:24px;padding-bottom:4px}
.count.leaving{animation:count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}

/* === CUSTOM CURSOR === */
.cursor{position:fixed;z-index:100;left:0;top:0;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.3);scale:1;transition:scale .3s cubic-bezier(.22,1,.36,1)}
.cursor.is-enter .cursor-orbit{scale:1.16}
.cursor-label{position:absolute;left:0;top:26px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s ease}
.cursor.is-enter .cursor-label{opacity:1}

/* === ENTRANCE ANIMATIONS === */
body:not(.app-ready) .header,
body:not(.app-ready) .dest-list,
body:not(.app-ready) .city-content h1,
body:not(.app-ready) .city-fact{opacity:0}

.app-ready .header{animation:from-top .9s cubic-bezier(.22,1,.36,1) .1s both}
.app-ready .dest-list{animation:from-left .9s cubic-bezier(.22,1,.36,1) .65s both}
@keyframes from-top{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}}
@keyframes from-left{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{transform:translate(0,-43%)}}

.revealing h1{animation:title-up 1.05s cubic-bezier(.16,1,.3,1) both}
.revealing .city-fact{animation:fact-up .72s cubic-bezier(.22,1,.36,1) both}
.revealing .city-fact:nth-child(1){animation-delay:.52s}
.revealing .city-fact:nth-child(2){animation-delay:.68s}
.revealing .city-fact:nth-child(3){animation-delay:.84s}
.revealing .city-fact:nth-child(4){animation-delay:1s}
@keyframes title-up{from{opacity:0;filter:blur(12px);transform:translate(-32px,42px)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-up{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}

.portal-visible .portal-heading{animation:from-bottom .85s cubic-bezier(.22,1,.36,1) both}
@keyframes from-bottom{from{opacity:0;filter:blur(7px);transform:translateY(22px)}}

.dest-switching .dest-item{animation:dest-row .58s cubic-bezier(.22,1,.36,1) both}
.dest-switching .dest-item:nth-child(1){animation-delay:.02s}
.dest-switching .dest-item:nth-child(2){animation-delay:.05s}
.dest-switching .dest-item:nth-child(3){animation-delay:.08s}
.dest-switching .dest-item:nth-child(4){animation-delay:.11s}
.dest-switching .dest-item:nth-child(5){animation-delay:.14s}
.dest-switching .dest-item:nth-child(6){animation-delay:.17s}
.dest-switching .dest-item:nth-child(7){animation-delay:.2s}
.dest-switching .dest-item:nth-child(8){animation-delay:.23s}
.dest-switching .dest-item.is-active::before{animation:dot-pop .55s cubic-bezier(.22,1,.36,1) .18s both}
@keyframes dest-row{from{opacity:.35;transform:translateX(-8px)}}
@keyframes dot-pop{from{opacity:0;transform:scale(0)}}

/* === RESPONSIVE === */
@media(max-width:900px){
  .nav{display:none}
  .portal-wrap{width:min(300px,48vw)}
  .city-content h1{font-size:clamp(105px,24vw,190px)}
  .city-content dl{width:43vw}
  .city-fact{grid-template-columns:110px 1fr}
  .dest-list{font-size:14px}
  .dest-item.is-active{font-size:16px}
}
@media(max-width:640px){
  .dest-list{display:none}
  .portal-wrap{width:min(260px,66vw);top:44%}
  .city-content{left:18px;right:18px;bottom:18px;flex-direction:column;align-items:flex-start;gap:20px}
  .city-content h1{font-size:clamp(98px,30vw,160px)}
  .city-content dl{width:100%;font-size:13px}
  .city-fact{grid-template-columns:92px 1fr;padding:5px 0}
  .portal-heading{font-size:14px}
  .portal{border-radius:70px}
  .cta-btn{height:38px}
}
@media(prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="experience" id="exp">

  <!-- BACKGROUNDS -->
  <div class="backgrounds" aria-hidden="true">

    <img id="bg-tokyo" class="background" alt="">

  <div class="preloader" id="preloader" aria-label="Loading">

      <line x1="2" y1="12" x2="30" y2="12" stroke="#F97316" stroke-width="1.2"/>
      <line x1="2" y1="20" x2="30" y2="20" stroke="#F97316" stroke-width="1.2"/>

  <!-- SCENE CANVAS (frozen frame during transition) -->

  <!-- HEADER -->
  <header class="header chrome">

  <!-- PORTAL SECTION -->
  <section class="portal-wrap chrome" aria-label="Next destination">

  <!-- CUSTOM CURSOR -->

</main>

<script>
'use strict';

/* ── ASSETS ── */
const U = 'https://images.unsplash.com/';
const A = {
  parisBg:     U + 'photo-1502602898657-3e91760cbb34?w=1920&q=85&auto=format&fit=crop',
  tokyoBg:     U + 'photo-1540959733332-eab4deabeeaf?w=1920&q=85&auto=format&fit=crop',
  nyBg:        U + 'photo-1534430480872-3498386e7856?w=1920&q=85&auto=format&fit=crop',
  tokyoPortal: U + 'photo-1513407030348-c983a97b98d8?w=1200&q=85&auto=format&fit=crop',
  nyPortal:    U + 'photo-1485871981521-5b1fd3805eee?w=1200&q=85&auto=format&fit=crop',
  londonNext:  U + 'photo-1513635269975-59663e0ac1ad?w=1200&q=85&auto=format&fit=crop',
  earthSpace:  U + 'photo-1446776811953-b23d57bd21aa?w=1920&q=85&auto=format&fit=crop',
};

/* Set background and preloader srcs immediately */
document.getElementById('bg-paris').src      = A.parisBg;
document.getElementById('bg-tokyo').src      = A.tokyoBg;
document.getElementById('bg-ny').src         = A.nyBg;
document.getElementById('preloader-img').src = A.earthSpace;

/* ── DATA ── */
const ALL_DESTS = ['Paris','Tokyo','NYC','London','Dubai','Bali','Sydney','Rome'];

const STATES = {
  paris: {
    name:'Paris', bg:'paris',
    next:'tokyo', nextName:'Tokyo', nextCode:'[JP]',
    portal: A.tokyoPortal,
    facts:[
      ['Best time:','April–June for spring blooms and mild, sunny weather.'],
      ['Known for:','Eiffel Tower, Louvre, Notre-Dame, and world-class cuisine.'],
      ['Language:','French; English widely spoken near major attractions.'],
      ['Time zone:','CET (UTC+1) / CEST (UTC+2) in summer.'],
    ],
  },
  tokyo: {
    name:'Tokyo', bg:'tokyo',
    next:'ny', nextName:'New York', nextCode:'[US]',
    portal: A.nyPortal,
    facts:[
      ['Best time:','March–May for cherry blossoms; Oct–Nov for autumn colour.'],
      ['Known for:','Shibuya crossing, Akihabara, Shinjuku gardens, and ramen.'],
      ['Language:','Japanese — major signs and menus are often bilingual.'],
      ['Time zone:','JST (UTC+9) — 9 hours ahead of Paris.'],
    ],
  },
  ny: {
    name:'New York', bg:'ny',
    next:null, nextName:null, nextCode:null,
    portal: A.londonNext,
    facts:[
      ['Best time:','September–November for crisp air and fall foliage.'],
      ['Known for:','Times Square, Central Park, High Line, and Broadway.'],
      ['Language:','English — the global crossroads of culture and commerce.'],
      ['Time zone:','EST (UTC-5) / EDT (UTC-4) in summer.'],
    ],
  },
};

/* ── CANVAS SETUP ── */
const portalCanvas = document.getElementById('portal-canvas');
const sceneCanvas  = document.getElementById('scene-canvas');
const pctx = portalCanvas.getContext('2d');
const sctx = sceneCanvas.getContext('2d');
const portalImg = document.getElementById('portal-img');
let dpr = 1;

function resizeCanvases() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  [portalCanvas, sceneCanvas].forEach(c => {
    c.width  = window.innerWidth  * dpr;
    c.height = window.innerHeight * dpr;
    c.style.width  = window.innerWidth  + 'px';
    c.style.height = window.innerHeight + 'px';
    c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  });
}
window.addEventListener('resize', resizeCanvases);

/* ── DRAW HELPERS ── */
function drawCover(ctx, img) {
  const iw = img.naturalWidth  || img.videoWidth  || 0;
  const ih = img.naturalHeight || img.videoHeight || 0;
  if (!iw || !ih) return;
  const sc = Math.max(window.innerWidth / iw, window.innerHeight / ih);
  ctx.drawImage(img, (window.innerWidth - iw*sc)/2, (window.innerHeight - ih*sc)/2, iw*sc, ih*sc);
}

function drawShade(ctx) {
  const g = ctx.createLinearGradient(0, window.innerHeight*.5, 0, window.innerHeight);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.9)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
}

/* ── PORTAL GEOMETRY ── */
function roundedRectPts(w, h, r, n) {
  n = n || 12;
  r = Math.min(r, w/2, h/2);
  const pts = [];
  const corners = [
    [ w/2-r, -h/2+r, -Math.PI/2,   0          ],
    [ w/2-r,  h/2-r,  0,            Math.PI/2  ],
    [-w/2+r,  h/2-r,  Math.PI/2,    Math.PI    ],
    [-w/2+r, -h/2+r,  Math.PI,    3*Math.PI/2  ],
  ];
  for (let ci = 0; ci < corners.length; ci++) {
    const cx = corners[ci][0], cy = corners[ci][1];
    const a0 = corners[ci][2], a1 = corners[ci][3];
    for (let i = 0; i <= n; i++) {
      const a = a0 + (a1-a0)*i/n;
      pts.push([cx + Math.cos(a)*r, cy + Math.sin(a)*r]);
    }
  }
  return pts;
}

function project3D(x, y, rx, ry, cx, cy) {
  const ax = rx * Math.PI / 180;
  const ay = ry * Math.PI / 180;
  const px = x * Math.cos(ay);
  const py = y * Math.cos(ax);
  const z  = x * Math.sin(ay) - y * Math.sin(ax);
  const p  = 900 / (900 + z);
  return [cx + px*p, cy + py*p];
}

/* ── STATE ── */
let current   = 'paris';
let busy      = false;
let expansion = 0;
let maskScale = 0;
let tiltX = 0, tiltY = 0, targetX = 0, targetY = 0;
let hasFrozen = false;
let traveling = false;
let lastTS    = null;
let everRendered = false;

/* ── RENDER ── */
function render() {
  const st  = STATES[current];
  const exp = document.getElementById('exp');

  document.getElementById('city-title').textContent = st.name.toUpperCase();

  /* next destination heading */
  const heading = document.getElementById('portal-heading');
  if (st.next) {
    document.getElementById('next-code').textContent = st.nextCode;
    document.getElementById('next-name').textContent = st.nextName;
    document.getElementById('portal').setAttribute('aria-label', 'Travel to ' + st.nextName);
    heading.style.visibility = '';
  } else {
    heading.style.visibility = 'hidden';
  }

  /* facts */
  const dl = document.getElementById('city-facts');
  dl.innerHTML = '';
  st.facts.forEach(function(pair) {
    var div = document.createElement('div');
    div.className = 'city-fact';
    div.innerHTML = '<dt>' + pair[0] + '</dt><dd>' + pair[1] + '</dd>';
    dl.appendChild(div);
  });

  /* sidebar list */
  const list = document.getElementById('dest-list');
  if (everRendered) {
    list.classList.remove('dest-switching');
    void list.offsetWidth;
    list.classList.add('dest-switching');
  }
  list.innerHTML = '';
  ALL_DESTS.forEach(function(d) {
    var span = document.createElement('span');
    span.className = 'dest-item' + (d === st.name ? ' is-active' : '');
    span.textContent = d;
    list.appendChild(span);
  });

  /* backgrounds */
  document.querySelectorAll('.background').forEach(function(el) {
    el.classList.remove('is-visible');
  });
  document.getElementById('bg-' + st.bg).classList.add('is-visible');

  /* portal image */
  if (st.portal && portalImg.src !== st.portal) {
    portalImg.src = st.portal;
  }

  everRendered = true;
}

/* ── EASING ── */
function eio(t) {
  return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
}
function animVal(fn, dur) {
  return new Promise(function(resolve) {
    var start = null;
    function step(ts) {
      if (!start) start = ts;
      var t = Math.min((ts - start) / dur, 1);
      fn(eio(t));
      if (t < 1) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

/* ── MAIN DRAW LOOP ── */
function draw(ts) {
  requestAnimationFrame(draw);

  var dt = lastTS ? Math.min(ts - lastTS, 40) : 16;
  lastTS = ts;

  var lf = Math.min(1, dt * .008);
  tiltX += (targetX - tiltX) * lf;
  tiltY += (targetY - tiltY) * lf;

  pctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  /* blit frozen frame if transitioning */
  if (hasFrozen) {
    pctx.drawImage(sceneCanvas, 0, 0, window.innerWidth, window.innerHeight);
    drawShade(pctx);
  }

  var btn  = document.getElementById('portal');
  var rect = btn.getBoundingClientRect();
  var e    = expansion;

  var rcx = rect.left + rect.width  / 2;
  var rcy = rect.top  + rect.height / 2;
  var cx  = rcx + (window.innerWidth  / 2 - rcx) * e;
  var cy  = rcy + (window.innerHeight / 2 - rcy) * e;
  var bw  = rect.width  + (window.innerWidth  - rect.width)  * e;
  var bh  = rect.height + (window.innerHeight - rect.height) * e;
  var ms  = e ? 1 : maskScale;
  var w   = bw * ms;
  var h   = bh * ms;
  var rad = 90 * (1 - e) * ms;
  var rx  = tiltX * (1 - e);
  var ry  = tiltY * (1 - e);

  if (w > 1 && h > 1) {
    var pts  = roundedRectPts(w, h, rad);
    var proj = pts.map(function(p) { return project3D(p[0], p[1], rx, ry, cx, cy); });

    pctx.save();
    pctx.beginPath();
    pctx.moveTo(proj[0][0], proj[0][1]);
    for (var i = 1; i < proj.length; i++) pctx.lineTo(proj[i][0], proj[i][1]);
    pctx.closePath();
    pctx.clip();

    pctx.fillStyle = '#060505';
    pctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    if (portalImg.complete && portalImg.naturalWidth) {
      if (traveling) {
        /* zoom in during travel to simulate forward motion */
        var zoom = 1 + e * 0.45;
        pctx.save();
        pctx.translate(window.innerWidth / 2, window.innerHeight / 2);
        pctx.scale(zoom, zoom);
        pctx.translate(-window.innerWidth / 2, -window.innerHeight / 2);
        drawCover(pctx, portalImg);
        pctx.restore();
        drawShade(pctx);
      } else {
        drawCover(pctx, portalImg);
      }
    }

    pctx.restore();
  }
}

/* ── REVEAL MASK ── */
function revealMask() {
  var exp = document.getElementById('exp');
  exp.classList.remove('portal-visible');
  void exp.offsetWidth;
  exp.classList.add('portal-visible');
  maskScale = 0;
  return animVal(function(v) { maskScale = v; }, 1050);
}

/* ── REVEAL CONTENT ── */
function revealContent() {
  var exp = document.getElementById('exp');
  exp.classList.remove('revealing');
  void exp.offsetWidth;
  exp.classList.add('revealing');
}

/* ── TRAVEL ── */
async function travel() {
  var st = STATES[current];
  if (busy || !st.next) return;
  busy = true;
  targetX = targetY = 0;

  var exp = document.getElementById('exp');
  exp.classList.add('is-loading');
  await new Promise(function(r) { setTimeout(r, 150); });

  exp.classList.remove('is-loading', 'revealing', 'portal-visible');
  exp.classList.add('is-transitioning');
  traveling = true;

  /* expand portal to fill viewport */
  await animVal(function(v) { expansion = v; }, 1100);
  await new Promise(function(r) { setTimeout(r, 350); });

  /* freeze destination image as background */
  sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  if (portalImg.complete && portalImg.naturalWidth) {
    drawCover(sctx, portalImg);
    drawShade(sctx);
  }
  hasFrozen = true;
  sceneCanvas.style.display = '';

  /* commit next state */
  current = st.next;
  exp.classList.add('is-committing');
  render();

  await new Promise(function(r) { requestAnimationFrame(function() { requestAnimationFrame(r); }); });

  traveling = false;
  expansion = 0;
  maskScale = 0;
  exp.classList.remove('is-transitioning', 'is-committing');
  hasFrozen = false;
  sceneCanvas.style.display = 'none';

  var mp = revealMask();
  setTimeout(revealContent, 100);
  await mp;
  await new Promise(function(r) { setTimeout(r, 400); });
  busy = false;
}

document.getElementById('portal').addEventListener('click', travel);

/* ── CURSOR ── */
var mx = 0, my = 0, ox = 0, oy = 0;
var cursorEl = document.getElementById('cursor');
var dotEl    = document.getElementById('cursor-dot');
var orbitEl  = document.getElementById('cursor-orbit');
var labelEl  = document.getElementById('cursor-label');

window.addEventListener('pointermove', function(e) {
  mx = e.clientX; my = e.clientY;
  cursorEl.classList.add('is-visible');
  dotEl.style.transform = 'translate3d(' + mx + 'px,' + my + 'px,0) translate(-50%,-50%)';
  if (!busy) {
    targetX = (e.clientY / window.innerHeight - .5) * -33;
    targetY = (e.clientX / window.innerWidth  - .5) * 37.4;
  }
});

window.addEventListener('mouseleave', function() {
  cursorEl.classList.remove('is-visible');
  targetX = targetY = 0;
});

var portalBtn = document.getElementById('portal');
portalBtn.addEventListener('pointerenter', function() { cursorEl.classList.add('is-enter'); });
portalBtn.addEventListener('pointerleave', function() {
  cursorEl.classList.remove('is-enter');
  targetX = targetY = 0;
});

function cursorLoop() {
  requestAnimationFrame(cursorLoop);
  ox += (mx - ox) * 0.2;
  oy += (my - oy) * 0.2;
  orbitEl.style.transform = 'translate3d(' + ox + 'px,' + oy + 'px,0) translate(-50%,-50%)';
  labelEl.style.transform = 'translate3d(' + ox + 'px,' + oy + 'px,0) translateX(-50%)';
}

/* ── NAVIGATION ── */
function goTo(href) {
  try { window.top.location.href = href; } catch(e) { window.location.href = href; }
}

document.getElementById('cta-btn').addEventListener('click', function() { goTo('/register'); });
document.querySelectorAll('.nav-link').forEach(function(a) {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    goTo(a.getAttribute('href'));
  });
});

/* ── PRELOADER ── */
async function boot() {
  /* prime portal image before starting counter */
  await new Promise(function(resolve) {
    var src = STATES[current].portal;
    if (!src) return resolve();
    portalImg.src = src;
    if (portalImg.complete && portalImg.naturalWidth) return resolve();
    portalImg.onload  = resolve;
    portalImg.onerror = resolve;
    setTimeout(resolve, 3500);
  });

  /* animate counter 0 → 100 */
  await new Promise(function(resolve) {
    var dur = 2800, start = null;
    function tick(ts) {
      if (!start) start = ts;
      var t = Math.min((ts - start) / dur, 1);
      document.getElementById('cv').textContent = Math.round(t * 100);
      if (t < 1) requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });

  document.getElementById('cv').textContent = '100';
  var countEl = document.getElementById('count');
  countEl.classList.add('leaving');

  var logo = document.getElementById('floating-logo');
  logo.classList.add('is-docked');
  document.getElementById('preloader').classList.add('is-bg');
  document.body.classList.add('app-ready');

  setTimeout(function() { countEl.remove(); }, 750);
  setTimeout(function() { logo.classList.add('is-settled'); }, 2000);

  var mp = revealMask();
  setTimeout(revealContent, 850);
  await mp;
}

/* ── BOOT ── */
resizeCanvases();
render();
requestAnimationFrame(draw);
requestAnimationFrame(cursorLoop);
boot();
</script>
</body>
